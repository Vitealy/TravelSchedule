openapi: 3.0.3
info:
  title: API.Rasp.Yandex.Net
  description: API Яндекс.Расписаний
  version: 3.0.0
servers:
  - url: https://api.rasp.yandex-net.ru
tags:
  - name: Список ближайших станций
    description: Список ближайших станций
  - name: Расписание рейсов между станциями
    description: Расписание рейсов между станциями
  - name: Расписание рейсов по станции
    description: Расписание рейсов по станции
  - name: Список станций следования
    description: Список станций следования
  - name: Ближайший город
    description: Ближайший город
  - name: Информация о перевозчике
    description: Информация о перевозчике
  - name: Список всех доступных станций
    description: Список всех доступных станций
  - name: Копирайт Яндекс Расписаний
    description: Копирайт Яндекс Расписаний
paths:
  /v3.0/nearest_stations/:
    get:
      tags:
        - getNearestStations
      summary: Список ближайших станций
      operationId: getNearestStations
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: lat
          in: query
          description: широта
          required: true
          schema:
            type: number
        - name: lng
          in: query
          description: долгота
          required: true
          schema:
            type: number
        - name: distance
          in: query
          description: радиус охвата
          required: true
          schema:
            type: integer
        - name: format
          in: query
          description: json или xml
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: lang
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stations'

  /v3.0/search/:
    get:
      tags:
        - getScheduleBetweenStations
      summary: Расписание рейсов между станциями
      operationId: getScheduleBetweenStations
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: Код станции отправления
          required: true
          schema:
            type: string
        - name: to
          in: query
          description: Код станции прибытия
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
        - name: date
          in: query
          description: Дата, на которую необходимо получить список рейсов
          required: false
          schema:
            type: string
        - name: transport_types
          in: query
          description: Тип транспортного средства
          required: false
          schema:
            type: string
        - name: system
          in: query
          description: Система кодирования
          required: false
          schema:
            type: string
        - name: show_systems
          in: query
          description: Система кодирования для ответа
          required: false
          schema:
            type: string
        - name: offset
          in: query
          description: Смещение относительно первого результата поиска
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Максимальное количество результатов поиска в ответе
          required: false
          schema:
            type: integer
        - name: add_days_mask
          in: query
          description: Признак возврата календаря хождения
          required: false
          schema:
            type: boolean
        - name: result_timezone
          in: query
          description: Часовой пояс для дат и времён в ответе
          required: false
          schema:
            type: string
        - name: transfers
          in: query
          description: Признак разрешения маршрутов с пересадками
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'

  /v3.0/schedule/:
    get:
      tags:
        - getScheduleOnStation
      summary: Расписание рейсов по станции
      operationId: getScheduleOnStation
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: station
          in: query
          description: Код станции
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
        - name: date
          in: query
          description: Дата, на которую необходимо получить список рейсов
          required: false
          schema:
            type: string
        - name: transport_types
          in: query
          description: Тип транспортного средства
          required: false
          schema:
            type: string
        - name: direction
          in: query
          description: Код направления
          required: false
          schema:
            type: string
        - name: system
          in: query
          description: Система кодирования
          required: false
          schema:
            type: string
        - name: show_systems
          in: query
          description: Система кодирования для ответа
          required: false
          schema:
            type: string
        - name: result_timezone
          in: query
          description: Часовой пояс для дат и времён в ответе
          required: false
          schema:
            type: string
        - name: event
          in: query
          description: Событие, по которому необходимо получить расписание
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOnStationResponse'

  /v3.0/thread/:
    get:
      tags:
        - getThreadStations
      summary: Список станций следования
      operationId: getThreadStations
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: uid
          in: query
          description: Идентификатор нитки
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
        - name: date
          in: query
          description: Дата, на которую необходимо получить список рейсов
          required: false
          schema:
            type: string
        - name: show_systems
          in: query
          description: Система кодирования для ответа
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'

  /v3.0/nearest_settlement/:
    get:
      tags:
        - getNearestSettlement
      summary: Ближайший город
      operationId: getNearestSettlement
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: lat
          in: query
          description: широта
          required: true
          schema:
            type: number
        - name: lng
          in: query
          description: долгота
          required: true
          schema:
            type: number
        - name: distance
          in: query
          description: радиус охвата
          required: false
          schema:
            type: integer
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'

  /v3.0/carrier/:
    get:
      tags:
        - getCarrierInfo
      summary: Информация о перевозчике
      operationId: getCarrierInfo
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: Код перевозчика
          required: true
          schema:
            type: string
        - name: system
          in: query
          description: Система кодирования (yandex, iata, sirena, express, esr)
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierResponse'

  /v3.0/stations_list/:
    get:
      tags:
        - getStationsList
      summary: Список всех доступных станций
      operationId: getStationsList
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
        - name: lang
          in: query
          description: Язык возвращаемой информации
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationsListResponse'

  /v3.0/copyright/:
    get:
      tags:
        - getCopyright
      summary: Копирайт Яндекс Расписаний
      operationId: getCopyright
      parameters:
        - name: apikey
          in: query
          description: API key
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: Формат ответа
          required: false
          schema:
            type: string
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Copyright'

components:
  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Schedule:
      type: object
      properties:
        desktop_url:
          type: string
        touch_url:
          type: string

    Station:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        short_title:
          type: string
        popular_title:
          type: string
        code:
          type: string
        lat:
          type: number
        lng:
          type: number
        station_type:
          type: string
        station_type_name:
          type: string
        transport_type:
          type: string
        distance:
          type: number
        majority:
          type: integer
        type_choices:
          $ref: '#/components/schemas/Schedule'

    Stations:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/Station'

    Carrier:
      type: object
      properties:
        code:
          type: integer
        contacts:
          type: string
        url:
          type: string
        title:
          type: string

    Thread:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        number:
          type: string
        short_title:
          type: string
        carrier:
          $ref: '#/components/schemas/Carrier'

    Segment:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/Station'
        to:
          $ref: '#/components/schemas/Station'
        thread:
          $ref: '#/components/schemas/Thread'
        departure:
          type: string
        arrival:
          type: string

    IntervalSegment:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/Station'
        thread:
          $ref: '#/components/schemas/Thread'

    ScheduleResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        interval_segments:
          type: array
          items:
            $ref: '#/components/schemas/IntervalSegment'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'

    ScheduleItem:
      type: object
      properties:
        thread:
          $ref: '#/components/schemas/Thread'
        departure:
          type: string
        arrival:
          type: string

    ScheduleOnStationResponse:
      type: object
      properties:
        station:
          $ref: '#/components/schemas/Station'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'

    Stop:
      type: object
      properties:
        station:
          $ref: '#/components/schemas/Station'
        arrival:
          type: string
        departure:
          type: string

    ThreadResponse:
      type: object
      properties:
        uid:
          type: string
        title:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'

    Settlement:
      type: object
      properties:
        title:
          type: string
        code:
          type: string
        lat:
          type: number
        lng:
          type: number
        distance:
          type: number

    CarrierFull:
      type: object
      properties:
        code:
          type: integer
        title:
          type: string
        url:
          type: string
        phone:
          type: string
        logo:
          type: string
        address:
          type: string
        email:
          type: string

    CarrierResponse:
      type: object
      properties:
        carrier:
          $ref: '#/components/schemas/CarrierFull'

    StationItem:
      type: object
      properties:
        title:
          type: string
        codes:
          type: object
          properties:
            yandex_code:
              type: string
        station_type:
          type: string
        transport_type:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    SettlementItem:
      type: object
      properties:
        title:
          type: string
        stations:
          type: array
          items:
            $ref: '#/components/schemas/StationItem'

    Region:
      type: object
      properties:
        title:
          type: string
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/SettlementItem'

    Country:
      type: object
      properties:
        title:
          type: string
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'

    StationsListResponse:
      type: object
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'

    CopyrightData:
      type: object
      properties:
        url:
          type: string
        logo_vm:
          type: string
        logo_vd:
          type: string
        logo_hy:
          type: string
        logo_hd:
          type: string
        logo_vy:
          type: string
        logo_hm:
          type: string
        logo_hh:
          type: string
        text:
          type: string

    Copyright:
      type: object
      properties:
        copyright:
          $ref: '#/components/schemas/CopyrightData'
